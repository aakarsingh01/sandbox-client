# ===============================================
# NGINX CONFIGURATION FOR CODESANDBOX CLIENT
# ===============================================
# Optimized nginx configuration for serving the CodeSandbox client
# with proper caching, compression, and security headers

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Document root
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ===============================================
    # Security Headers
    # ===============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Content Security Policy - Adjusted for CodeSandbox requirements
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' 
            *.codesandbox.io 
            *.jsdelivr.net 
            *.unpkg.com 
            *.cdnjs.cloudflare.com 
            blob: data:;
        style-src 'self' 'unsafe-inline' 
            *.googleapis.com 
            *.codesandbox.io;
        font-src 'self' 
            *.googleapis.com 
            *.gstatic.com 
            data:;
        img-src 'self' 
            data: 
            blob: 
            *.githubusercontent.com 
            *.codesandbox.io;
        connect-src 'self' 
            *.codesandbox.io 
            wss: 
            ws:;
        frame-src 'self' 
            *.codesandbox.io 
            *.csb.app;
        worker-src 'self' 
            blob:;
        object-src 'none';
        base-uri 'self';
    " always;

    # ===============================================
    # Compression Settings
    # ===============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/x-font-ttf
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;

    # ===============================================
    # Static Assets with Long-term Caching
    # ===============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # CORS for assets
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        
        # Brotli compression for supported browsers
        location ~* \.(js|css)$ {
            add_header Vary "Accept-Encoding";
        }
    }

    # ===============================================
    # Font Files with CORS
    # ===============================================
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        access_log off;
    }

    # ===============================================
    # API Routes (if any)
    # ===============================================
    location /api/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ @fallback;
    }

    # ===============================================
    # Sandbox Embeddings
    # ===============================================
    location /embed/ {
        # Allow embedding for sandbox functionality
        add_header X-Frame-Options "";
        add_header Content-Security-Policy "frame-ancestors *;";
        try_files $uri $uri/ @fallback;
    }

    # ===============================================
    # Public Assets
    # ===============================================
    location /public/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # ===============================================
    # Static Files (www directory content)
    # ===============================================
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===============================================
    # Service Worker
    # ===============================================
    location /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ===============================================
    # Manifest and PWA files
    # ===============================================
    location ~* \.(webmanifest|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
    }

    # ===============================================
    # Main Location Block - SPA Routing
    # ===============================================
    location / {
        # Try to serve request as file, then as directory, then fallback to index
        try_files $uri $uri/ @fallback;
        
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type "text/plain; charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # ===============================================
    # SPA Fallback
    # ===============================================
    location @fallback {
        rewrite ^.*$ /index.html last;
    }

    # ===============================================
    # Health Check Endpoint
    # ===============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain; charset=UTF-8";
    }

    # ===============================================
    # Security - Deny Access to Hidden Files
    # ===============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ===============================================
    # Deny Access to Sensitive Files
    # ===============================================
    location ~* \.(log|conf|env)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ===============================================
    # Error Pages
    # ===============================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ===============================================
    # Rate Limiting (Optional - uncomment to enable)
    # ===============================================
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=api burst=20 nodelay;
    # }
}