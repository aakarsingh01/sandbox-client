# ===============================================
# NGINX CONFIGURATION FOR CODESANDBOX CLIENT
# ===============================================
# Optimized nginx configuration for serving the CodeSandbox client
# with proper caching, compression, and security headers

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Document root
    root /usr/share/nginx/html;
    index app.html index.html index.htm;

    # ===============================================
    # Security Headers (Relaxed for Development)
    # ===============================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Content Security Policy - Relaxed for development/testing
    add_header Content-Security-Policy "
        default-src * 'unsafe-inline' 'unsafe-eval';
        script-src * 'unsafe-inline' 'unsafe-eval' blob: data:;
        style-src * 'unsafe-inline' blob: data:;
        font-src * blob: data:;
        img-src * blob: data:;
        connect-src * wss: ws: blob: data: https://unpkg.com https://cdn.jsdelivr.net https://cdn.skypack.dev https://esm.sh;
        frame-src *;
        worker-src * blob: data:;
        object-src *;
        base-uri *;
        child-src * blob: data:;
    ";

    # ===============================================
    # Compression Settings
    # ===============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/x-font-ttf
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;

    # ===============================================
    # Static Assets with Long-term Caching
    # ===============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # CORS for assets - Allow all origins
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        
        # Brotli compression for supported browsers
        location ~* \.(js|css)$ {
            add_header Vary "Accept-Encoding";
        }
    }

    # ===============================================
    # Font Files with CORS
    # ===============================================
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        access_log off;
    }

    # ===============================================
    # API Routes (Mock responses for offline mode)
    # ===============================================
    
    # Startup configuration endpoint for Sandpack (exact match - highest priority)
    location = /api/config {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header Content-Type "application/json";
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # Return configuration with bundler URLs for Sandpack
        return 200 '{
            "bundlerURL": "$scheme://$http_host",
            "staticBundlerURL": "$scheme://$http_host",
            "sandpack": {
                "bundlerURL": "$scheme://$http_host",
                "enabled": true,
                "offline": false
            },
            "features": {
                "artifacts": true,
                "bundler": true,
                "sandpack": true
            },
            "environment": "self-hosted",
            "version": "1.0.0"
        }';
    }
    
    # Generic API fallback for other endpoints (lower priority)
    location /api/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        add_header Content-Type "application/json";
        return 200 '{"status":"offline","message":"Running in offline mode"}';
    }

    # Bundler compile endpoint for code compilation (exact match)
    location = /bundler/compile {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header Content-Type "application/json";
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # Mock compilation response
        return 200 '{"status":"success","code":"export default function App() { return <div>Hello World!</div>; }","map":null}';
    }

    # Bundler status endpoint
    location /bundler/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        add_header Content-Type "application/json";
        return 200 '{"bundler":"local","status":"ready","transpilers":["babel","typescript","sass","vue","svelte"]}';
    }

    # Sandbox creation endpoint
    location /api/v1/sandboxes {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        add_header Content-Type "application/json";
        return 200 '{"id":"test-sandbox","alias":null,"title":"Test Sandbox","template":"react","modules":[],"directories":[]}';
    }

    # Preview iframe endpoint
    location ~ ^/sandbox/([a-zA-Z0-9-]+)/?(.*)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        add_header X-Frame-Options "";
        add_header Content-Security-Policy "frame-ancestors *;";
        
        # Return a simple React preview
        add_header Content-Type "text/html";
        return 200 '<!DOCTYPE html>
<html>
<head>
    <title>React Preview</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            return React.createElement("div", null, "Hello from React Sandbox!");
        }
        ReactDOM.render(React.createElement(App), document.getElementById("root"));
    </script>
</body>
</html>';
    }

    # NPM package proxy (for external dependencies)
    location /npm/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        
        # Rewrite to unpkg.com
        rewrite ^/npm/(.*)$ https://unpkg.com/$1 break;
        proxy_pass https://unpkg.com;
        proxy_ssl_server_name on;
        proxy_set_header Host unpkg.com;
        proxy_set_header User-Agent "CodeSandbox-Self-Hosted";
    }

    # ===============================================
    # Sandbox Embeddings
    # ===============================================
    location /embed/ {
        # Allow embedding from any origin
        add_header X-Frame-Options "";
        add_header Content-Security-Policy "frame-ancestors *;";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "*";
        add_header Access-Control-Allow-Headers "*";
        try_files $uri $uri/ @fallback;
    }

    # ===============================================
    # Public Assets
    # ===============================================
    location /public/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # ===============================================
    # Static Files (www directory content)
    # ===============================================
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===============================================
    # Service Worker
    # ===============================================
    location /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ===============================================
    # Manifest and PWA files
    # ===============================================
    location ~* \.(webmanifest|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
    }

    # ===============================================
    # Main Location Block - Handle Root and SPA Routing
    # ===============================================
    location / {
        # Special handling for root path
        if ($request_uri = /) {
            add_header Content-Type "text/html; charset=UTF-8";
            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSandbox Self-Hosted</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; margin: 0; padding: 40px; background: #0e1525; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        .logo { font-size: 2.5rem; font-weight: bold; margin-bottom: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .message { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }
        .instructions { background: #1a202c; border-radius: 8px; padding: 2rem; margin: 2rem 0; text-align: left; }
        .instructions h3 { margin-top: 0; color: #4299e1; }
        .code { background: #2d3748; padding: 1rem; border-radius: 4px; font-family: Monaco, Menlo, monospace; font-size: 0.9rem; margin: 1rem 0; overflow-x: auto; }
        .warning { background: #742a2a; border: 1px solid #e53e3e; border-radius: 8px; padding: 1rem; margin: 2rem 0; }
        .link { color: #4299e1; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📦 CodeSandbox Self-Hosted</div>
        
        <div class="message">
            This is a self-hosted CodeSandbox instance running in containerized mode.
        </div>
        
        <div class="warning">
            <strong>⚠️ Notice:</strong> This deployment does not support the full CodeSandbox web application interface.
        </div>
        
        <div class="instructions">
            <h3>🚀 To use this CodeSandbox instance:</h3>
            <p><strong>Option 1: Use the API directly</strong></p>
            <div class="code">
                # Get configuration<br>
                curl http://localhost:3000/api/config<br><br>
                # Access bundler<br>
                curl http://localhost:3000/bundler/
            </div>
            
            <p><strong>Option 2: Download and run locally</strong></p>
            <ol>
                <li>Clone the repository</li>
                <li>Install dependencies: yarn install</li>
                <li>Run locally: yarn start</li>
            </ol>
            
            <p><strong>Option 3: Use Sandpack components</strong></p>
            <p>Integrate this bundler with your React application using @codesandbox/sandpack-react components by pointing the bundlerURL to this instance.</p>
        </div>
        
        <div style="margin-top: 3rem; font-size: 0.9rem; opacity: 0.7;">
            <p>Powered by CodeSandbox • <a href="https://github.com/codesandbox/codesandbox-client" class="link">GitHub</a></p>
        </div>
    </div>
</body>
</html>';
        }
        
        # Try to serve request as file, then as directory, then fallback to index
        try_files $uri $uri/ @fallback;
        
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type "text/plain; charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # ===============================================
    # SPA Fallback
    # ===============================================
    location @fallback {
        rewrite ^.*$ /app.html last;
    }

    # ===============================================
    # Health Check Endpoint
    # ===============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain; charset=UTF-8";
    }

    # ===============================================
    # Security - Deny Access to Hidden Files
    # ===============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ===============================================
    # Deny Access to Sensitive Files
    # ===============================================
    location ~* \.(log|conf|env)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ===============================================
    # Error Pages
    # ===============================================
    error_page 404 /app.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ===============================================
    # Rate Limiting (Optional - uncomment to enable)
    # ===============================================
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=api burst=20 nodelay;
    # }
}