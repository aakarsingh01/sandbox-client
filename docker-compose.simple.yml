# Simple Docker Compose for CodeSandbox Client
# Just builds and serves the app with nginx

version: '3.8'

services:
  codesandbox:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: codesandbox-client
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

# Usage:
# docker-compose up --build
# Then visit http://localhost:3000